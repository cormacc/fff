name: Check PR

on:
  pull_request:
    branches:
      - master
  push:


jobs:
  check-pr:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        generator: [Ninja]
        # The Ninja build on Windows uses MinGW GCC; this entry builds with MSVC
        include:
          - os: windows-latest
            generator: Visual Studio
    steps:
      - uses: actions/checkout@v3
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Build
        run: |
          mkdir build
          cmake ${{ matrix.generator == 'Ninja' && '-GNinja' || '' }} -B build -DFFF_UNIT_TESTING=ON
          cmake --build build --config Debug
          ctest --test-dir build -C Debug --output-on-failure

